name: iOS CI

on:
  push:
    branches: [main, develop, 'sprint-*']
    paths:
      - 'chronir/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main, develop, 'sprint-*']
    paths:
      - 'chronir/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: |
          cd chronir
          swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Unit tests + build
    runs-on: macos-26
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # Newest Xcode 26 on the runner image; the exact point release changes.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"
      - name: Test
        # Same destination and flags as IOS-10 (.claude/rules/ios.md). No `|| true`:
        # a red build or test must fail the job. CompleteAlarmIntentTests needs real AlarmKit
        # and crashes the simulator test host before bootstrapping (device-only, INFRA-03).
        run: |
          xcodebuild test \
            -project chronir/chronir.xcodeproj \
            -scheme chronir \
            -only-testing:chronirTests \
            -skip-testing:chronirTests/CompleteAlarmIntentTests \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION=YES
